services:
  blog-matthesketh-pro:
    build:
      context: .
    container_name: blog-matthesketh-pro
    ports:
      - "127.0.0.1:60612:60612"
    volumes:
      - blog-data:/app/data
      - blog-content:/app/blog/content
    environment:
      - ADMIN_HOST=admin.matthesketh.pro
      - RP_ID=matthesketh.pro
      - ORIGIN=https://admin.matthesketh.pro
      - DB_HOST=shared-postgres
      - DB_PORT=5432
      - DB_NAME=blog_admin
      - DB_USER=blog_admin
      - DB_PASSWORD=6+Z6BqWnYbn1LtQYYCLPz+kHTGGR1YKsyzVguCdtN5c=
      # public reader origin (stripe success/cancel + magic-link urls)
      - PUBLIC_URL=https://blog.matthesketh.pro
      # ad-free subscription secrets, sourced from the fleet vault. each is
      # optional — the feature stays dormant until they are set.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - ADFREE_SECRET=${ADFREE_SECRET:-}
      - SMTP_URL=${SMTP_URL:-}
      - MAIL_FROM=${MAIL_FROM:-Matt Hesketh <hello@matthesketh.pro>}
    networks:
      - default
      - databases
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

volumes:
  blog-data:
  blog-content:

networks:
  databases:
    external: true
